---
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
      - name: Build HACS archive
        working-directory: custom_components/ariston_net
        run: zip -r "${GITHUB_WORKSPACE}/ariston_net.zip" .
      - name: Upload HACS archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${GITHUB_WORKSPACE}/ariston_net.zip" --clobber
